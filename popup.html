<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unabridged</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-surface="popup">
  <!-- 2d · Toolbar popup: the now-playing block alone -->
  <div class="pop">
    <div class="np on-block">
      <div class="np-row">
        <div class="ring" id="ring">
          <svg class="ring-svg" viewBox="0 0 60 60" aria-hidden="true">
            <circle class="track" cx="30" cy="30" r="26"></circle>
            <circle class="fill" id="ringFill" cx="30" cy="30" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"></circle>
          </svg>
          <button class="btn-ring" id="btnPlay" data-state="stopped" aria-label="Play" aria-pressed="false">
            <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
            <svg class="ic-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
          </button>
        </div>
        <div class="np-text">
          <div class="np-title" id="npTitle">Nothing playing</div>
          <div class="np-meta"><span class="np-min num" id="npMin"></span></div>
        </div>
      </div>
      <div class="strip" id="strip" role="list" aria-label="Chapters"></div>
    </div>
    <div class="pop-ctl">
      <button class="step hit" id="btnPrev" aria-label="Back one sentence">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"></path><path d="m18 17-5-5 5-5"></path></svg>
      </button>
      <button class="step hit" id="btnNext" aria-label="Forward one sentence">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path></svg>
      </button>
      <button class="btn btn-primary" id="btnMain">Open the panel</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
